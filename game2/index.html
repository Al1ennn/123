<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шалений Кухар: Збери інгредієнти</title>
    <link rel="stylesheet" href="style.css">

<body>
    <div id="game-container">
        <div id="game-ui">
            <h1>👨‍🍳 Шалений Кухар</h1>
            <div id="top-stats">
                <div>Рівень: <span id="level-display">1</span></div>
                <div>Інгредієнти: <span id="score-display">0</span></div>
                <div id="lives-container">Життя: <span id="lives-display">❤️❤️❤️</span></div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>

        <div id="mobile-controls">
            <div class="control-row">
                <button id="btn-up" class="dpad-btn">W</button>
            </div>
            <div class="control-row">
                <button id="btn-left" class="dpad-btn">A</button>
                <button id="btn-down" class="dpad-btn">S</button>
                <button id="btn-right" class="dpad-btn">D</button>
            </div>
        </div>
    </div>
    
    <div id="win-screen" class="screen">
        <h2 style="color: #0f0; text-shadow: 0 0 20px #0f0;">СТРАВА ГОТОВА!</h2>
        <p>Ти зібрав усі необхідні інгредієнти.</p>
        <div style="display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center;">
            <button id="next-level-btn" style="color: #0f0; border-color: #0f0;">👉 Наступний рецепт</button>
            <button onclick="alert('РЕЦЕПТ ВІДКРИТО!\n\nСекрет ідеального борщу: додайте трохи чорносливу та ложку меду наприкінці варіння!'); location.reload();" style="color: #ff0; border-color: #ff0;">📖 Прочитати рецепт</button>
        </div>
    </div>

    <div id="final-win-screen" class="screen">
        <h2 style="color: #0ff; text-shadow: 0 0 20px #0ff;">ШЕФ-КУХАР МІШЛЕН!</h2>
        <p>Ти пройшов усі 3 кухні і не зіпсував жодної страви.</p>
        <button onclick="alert('ВІТАЄМО!\n\nТи відкрив доступ до нашої секретної кулінарної книги на сайті!'); location.reload();" style="color: #0ff; border-color: #0ff; margin-top: 20px;">👑 Забрати супер-рецепт</button>
    </div>

    <div id="lose-screen" class="screen">
        <h2 style="color: #f00; text-shadow: 0 0 20px #f00;">СТРАВУ ЗІПСОВАНО!</h2>
        <p>Кухня закривається на прибирання.</p>
        <button onclick="location.reload()">Спробувати ще раз</button>
    </div>
