<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шалений Кухар: Ретро Рецепти</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-ui">
            <h1>👨‍🍳 Шалений Кухар</h1>
            <div id="top-stats">
                <div>Рівень: <span id="level-display">1</span></div>
                <div>Інгредієнти: <span id="score-display">0</span></div>
                <div id="lives-container">Життя: <span id="lives-display">❤️❤️❤️</span></div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>

        <div id="mobile-controls">
            <div class="control-row">
                <button id="btn-up" class="dpad-btn">W</button>
            </div>
            <div class="control-row">
                <button id="btn-left" class="dpad-btn">A</button>
                <button id="btn-down" class="dpad-btn">S</button>
                <button id="btn-right" class="dpad-btn">D</button>
            </div>
        </div>
    </div>
    
    <!-- Екран перемоги з РЕЦЕПТОМ -->
    <div id="win-screen" class="screen">
        <h2 style="color: #0f0; text-shadow: 0 0 20px #0f0;">ІНГРЕДІЄНТИ ЗІБРАНО!</h2>
        <div style="background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 10px; max-width: 600px; border: 2px solid #0f0; margin: 15px;">
            <h3 id="recipe-title" style="color: #ff0; margin-top: 0; font-size: 1.5em;"></h3>
            <p id="recipe-text" style="font-size: 1.1em; text-align: justify; line-height: 1.4;"></p>
        </div>
        <button id="next-level-btn" style="color: #0f0; border-color: #0f0;">👉 Готувати далі</button>
    </div>

    <!-- Фінальний екран -->
    <div id="final-win-screen" class="screen">
        <h2 style="color: #0ff; text-shadow: 0 0 20px #0ff;">ЛЕГЕНДА КУЛІНАРІЇ!</h2>
        <div style="background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 10px; max-width: 600px; border: 2px solid #0ff; margin: 15px;">
            <h3 id="final-recipe-title" style="color: #ff0; margin-top: 0; font-size: 1.5em;"></h3>
            <p id="final-recipe-text" style="font-size: 1.1em; text-align: justify; line-height: 1.4;"></p>
        </div>
        <button onclick="location.reload()" style="color: #0ff; border-color: #0ff; margin-top: 10px;">🔄 Зіграти ще раз</button>
    </div>

    <div id="lose-screen" class="screen">
        <h2 style="color: #f00; text-shadow: 0 0 20px #f00;">КУХНЯ ЗГОРІЛА!</h2>
        <p>Ти втратив усі життя.</p>
        <button onclick="location.reload()">Спробувати ще раз</button>
    </div>
